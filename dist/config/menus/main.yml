# WoW Forever: tools/wow_menu_panels.py
# Меню TerraWoWmain: /twm menu main
main:
  title: <#8A5A12>✦ <#3A2410>Азерот • Главное меню <#8A5A12>✦
  rows: 6
  fill: frame
  items:
    trim:
      slots:
      - 0
      - 8
      - 53
      icon: ORANGE_STAINED_GLASS_PANE
      name: ' '
    hero:
      slots:
      - 4
      icon: head:{player}
      name: <#FFD100>{player}
      lore:
      - '<gray>Класс: <white>%mmocore_class%'
      - '<gray>Уровень: <white>%mmocore_level% <dark_gray>/ 60'
      - '<gray>Опыт: <white>%mmocore_level_percent%%'
      - ''
      - '<gray>Здоровье: <#FF4040>%mmocore_health%<gray> / %mmocore_max_health%'
      - '<gray>Очки талантов: <white>%mmocore_skill_tree_points_global%'
      - '<gray>Кошелёк: <#FFD100>%twm_gold%'
      click:
      - close
      - delay 1
      - console mmocore:player {player}
    class_choose:
      slots:
      - 13
      icon: BEACON
      glint: true
      name: <#1EFF00>✦ Выбрать класс
      lore:
      - <gray>Вы ещё не выбрали свой путь.
      - <gray>Девять классов Азерота ждут вас.
      - ''
      - <#FFE88A>▸ Нажмите, чтобы выбрать
      show-if: '%mmocore_class_id% == HUMAN'
      click:
      - close
      - delay 1
      - console mmocore:class {player}
    class_current:
      slots:
      - 13
      icon: BEACON
      name: '<#FFD100>Ваш класс: <white>%mmocore_class%'
      lore:
      - '<gray>Уровень класса: <white>%mmocore_level%'
      - ''
      - <#FFE88A>▸ Нажмите, чтобы сменить класс
      - <dark_gray>Смена класса сбрасывает весь прогресс класса.
      click:
      - open change_class
    label_hero:
      slots:
      - 18
      icon: YELLOW_STAINED_GLASS_PANE
      name: <#FFD100>◆ Ваш герой ▸
      lore:
      - <gray>Персонаж, заклинания, таланты,
      - <gray>характеристики и профессии.
    character:
      slots:
      - 20
      icon: ARMOR_STAND
      name: <#FFD100>Персонаж
      lore:
      - <gray>Уровень, боевые показатели,
      - <gray>характеристики и профессии.
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - console mmocore:player {player}
    spellbook:
      slots:
      - 21
      icon: ENCHANTED_BOOK
      name: <#FFD100>Книга заклинаний
      lore:
      - <gray>Заклинания класса и 9 ячеек.
      - '<gray>Применение: <white>F<gray>, затем <white>1–9<gray>.'
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /mmocore:skills
    talents:
      slots:
      - 22
      icon: NETHER_STAR
      name: <#FFD100>Таланты
      lore:
      - <gray>Три ветки талантов вашего класса.
      - '<gray>Свободно очков: <white>%mmocore_skill_tree_points_global%'
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /mmocore:skilltrees
    attributes:
      slots:
      - 23
      icon: GOLDEN_APPLE
      name: <#FFD100>Характеристики
      lore:
      - <gray>Сила, ловкость, выносливость,
      - <gray>интеллект и дух.
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /mmocore:attributes
    professions:
      slots:
      - 24
      icon: CRAFTING_TABLE
      name: <#FFD100>Профессии
      lore:
      - <gray>9 основных и 3 вспомогательные
      - <gray>профессии, навык до 300.
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - open professions
    label_world:
      slots:
      - 27
      icon: LIGHT_BLUE_STAINED_GLASS_PANE
      name: <#69CCF0>◆ Мир Азерота ▸
      lore:
      - <gray>Раса, маунты, питомцы,
      - <gray>путешествия и деньги.
    race:
      slots:
      - 29
      icon: TOTEM_OF_UNDYING
      name: <#FFD100>Раса
      lore:
      - <gray>Ваша раса, фракция и расовые
      - '<gray>особенности. Способность: <white>/twm racial'
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /twm race
    mounts:
      slots:
      - 30
      icon: SADDLE
      name: <#FFD100>Маунты
      lore:
      - <gray>Ездовые и летающие животные.
      - <gray>Призыв — 3 секунды, и вы в седле.
      - <gray>Облики маунтов — ПКМ в журнале.
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /twm mount
    pets:
      slots:
      - 31
      icon: LEAD
      name: <#FFD100>Питомцы
      lore:
      - <gray>Спутники, что всюду следуют за вами.
      - <gray>Облики питомцев — ПКМ в журнале.
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /twm pet
    travel:
      slots:
      - 32
      icon: COMPASS
      name: <#FFD100>Путешествия
      lore:
      - <gray>Открытые точки перемещения.
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - console mmocore:waypoints {player}
    economy:
      slots:
      - 33
      icon: GOLD_INGOT
      name: <#FFD100>Экономика
      lore:
      - <gray>Кошелёк, банк, почта, торговля
      - <gray>и аукцион.
      - '<gray>Монеты: <#FFD100>%twm_gold%'
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /twm economy
    label_social:
      slots:
      - 36
      icon: LIME_STAINED_GLASS_PANE
      name: <#1EFF00>◆ Сообщество ▸
      lore:
      - <gray>Группа, друзья и гильдия.
    party:
      slots:
      - 39
      icon: CAMPFIRE
      name: <#FFD100>Группа
      lore:
      - <gray>Группа до 5 искателей приключений.
      - '<gray>Сейчас в группе: <white>%mmocore_party_count%'
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /mmocore:party
    friends:
      slots:
      - 40
      icon: WRITABLE_BOOK
      name: <#FFD100>Друзья
      lore:
      - '<gray>Друзья в сети: <white>%mmocore_online_friends%'
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /mmocore:friends
    guild:
      slots:
      - 41
      icon: WHITE_BANNER
      name: <#FFD100>Гильдия
      lore:
      - '<gray>Ваша гильдия: <white>%mmocore_guild_name%'
      - ''
      - <#FFE88A>▸ Нажмите, чтобы открыть
      click:
      - close
      - delay 1
      - chat /mmocore:guild
    close:
      slots:
      - 45
      icon: BARRIER
      name: <#FF4040>✘ Закрыть
      lore:
      - <gray>Закрыть меню и вернуться в игру.
      click:
      - close
    help:
      slots:
      - 49
      icon: BOOK
      name: <#FFD100>❓ Как пользоваться
      lore:
      - <gray>Это главное меню — отсюда открываются
      - <gray>все окна сервера. Наведите на кнопку,
      - <gray>чтобы прочитать, что в ней, и нажмите.
      - ''
      - <gray>В каждом окне слева внизу —
      - '<#FFE88A>◂ Главное меню<gray>: вернуться сюда.'
      - '<gray>В центре внизу — <#FFE88A>❓<gray>: подсказка к окну.'
      - ''
      - '<gray>Открыть меню: <white>/menu <gray>или <white>/wow'
    frame:
      icon: BLACK_STAINED_GLASS_PANE
      name: ' '
