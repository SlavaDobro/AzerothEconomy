    - {name: 'Дипломатия', text: 'Умение находить общий язык'}
    racial:
      name: 'Каждый за себя'
      text: ['Снимает замедление, слепоту, слабость,', 'тошноту и яд.']
      cooldown: 180
      actions:
      - {type: cleanse, effects: [SLOWNESS, MINING_FATIGUE, WEAKNESS, BLINDNESS, NAUSEA, DARKNESS, LEVITATION, POISON]}
      - {type: sound, sound: entity.player.levelup, volume: 0.6, pitch: 1.4}
      - {type: particle, particle: end_rod, count: 25, spread: 0.6}
