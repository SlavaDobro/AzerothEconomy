# TerraWoWmain — расы Азерота (Альянс и Орда).
#
# Игрок выбирает фракцию, расу и пол при первом входе. Сменить расу может только админ:
#   /race set <ник> <раса> [male|female]  ·  /race reset <ник>
# При смене расы всё старое снимается (рост, пассивки, скин) и ставится новое.
#
# passives — постоянные бонусы расы. У каждого бонуса:
#   stat:       стат MythicLib/MMOCore (MAX_HEALTH, MAX_MANA, HEALTH_REGENERATION, MANA_REGENERATION,
#               CRITICAL_STRIKE_CHANCE, DODGE_RATING, PHYSICAL_DAMAGE, MAGIC_DAMAGE, MAGIC_DAMAGE_REDUCTION,
#               ICE_DEFENSE_PERCENT, EARTH_DEFENSE_PERCENT, DARKNESS_DEFENSE_PERCENT, FIRE_DEFENSE_PERCENT …)
#     amount + type: relative (проценты: 5 = +5%) или flat (число)
#   attribute:  атрибут Minecraft (knockback_resistance, oxygen_bonus, block_break_speed, safe_fall_distance,
#               movement_speed, attack_speed …)
#     amount + operation: add_number | add_multiplied_base | add_multiplied_total
#   Без stat/attribute бонус только описывается (для атмосферы).
#
# racial — активная расовая способность (/racial). actions выполняются по порядку:
#   cleanse  {effects: [SLOWNESS, POISON …]}               снять эффекты
#   effect   {effects: ['RESISTANCE 1 8']}                  наложить на себя: тип, уровень, секунды
#   area     {radius: 5, effects: [...], players: false}    на врагов вокруг (игроков — только при players: true)
#   heal     {percent: 20, seconds: 15}                     лечение % от макс. здоровья (seconds 0 — сразу)
#   mana     {percent: 10}                                  мана MMOCore
#   velocity {forward: 1.4, up: 0.8}                        рывок
#   safe-fall {seconds: 5}                                  без урона от падения
#   stealth  {seconds: 30}                                  невидимость, пока стоите на месте и не атакуете
#   sound    {sound: entity.player.levelup, volume: 1, pitch: 1}
#   particle {particle: cloud, count: 30, spread: 0.6}
#
# scale — рост (1.0 = обычный игрок). Женские персонажи — scale × settings.female-scale.
# classes — какие классы MMOCore доступны расе (ID файлов MMOCore/classes). Класс, которого нет
#   ни у одной расы (например, особые классы), доступен всем.
# skins — подписанные скины (value + signature с mineskin.org); при выборе расы берётся случайный.
#   Обычно их не пишут сюда вручную: tools/sign_race_skins.py кладёт их в race-skins.yml рядом
#   (формат: <раса>: {male: [{name, value, signature}], female: [...]}); оба списка складываются.

settings:
  open-on-join: true          # первый вход без расы — сразу окно выбора
  force-choice: true          # окно открывается снова, пока раса не выбрана (кроме terrawow.admin)
  class-rules: true           # ограничение классов по расе
  # консольная команда после выбора расы, если у игрока ещё нет класса ({player} — ник)
  after-choice-command: 'mmocore:class {player}'
  default-class: human        # стартовый «пустой» класс MMOCore
  female-scale: 0.96

class-names:
  warrior: '<#C79C6E>Воин'
  paladin: '<#F58CBA>Паладин'
  hunter: '<#ABD473>Охотник'
  rogue: '<#FFF569>Разбойник'
  priest: '<#FFFFFF>Жрец'
  shaman: '<#0070DE>Шаман'
  mage: '<#69CCF0>Маг'
  warlock: '<#9482C9>Чернокнижник'
  druid: '<#FF7D0A>Друид'

factions:
  alliance:
    name: '<#3F7FFF>Альянс'
    icon: BLUE_BANNER
    lore:
    - 'Союз королевств, верных чести,'
    - 'свету и древним клятвам.'
  horde:
    name: '<#C41F3B>Орда'
    icon: RED_BANNER
    lore:
    - 'Братство изгнанников и воинов,'
    - 'закалённых в борьбе за выживание.'

